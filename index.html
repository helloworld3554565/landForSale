<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة بيع الاراضي</title>

  <style>
  * {
    margin: 0;
    padding: 0;
    font-family: 'Changa', sans-serif; 
    
  }
  body {
      background: #000;
    }
 #all {
   height: Calc(100vh - 180px);
   width:100vw;
   background-color:#55ea44;
   position:fixed;
   overflow: hidden;
   top: 180px;
   left:0;
   display: flex;
   place-items: center;
   align-items: center;
   background-image: 
    linear-gradient(to right, #000 1px, transparent 1px),
    linear-gradient(to bottom, #000 1px, transparent 1px);
  background-size: 60px 60px;
 }
#sells {
  width: 100%;
  height: 100px;
  display: flex;
  flex-flow: row;
  gap: 80px;
  align-items: center;
  justify-content: center;
}
button[command = close]{
  background: none;
  border: none;
}
#points {
  width: 100px;
  height:30px;
  background:rgba(255, 255, 255, 0.2);
  color: #fff;
  display: flex;
  flex-flow: row-reverse;
  gap: 5px;
  border-radius: 0 20px 20px 0;
 place-content: center;
  place-items: center;
}
  #chosec {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  justify-content: center;
  }
   #areas,#etu {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
     align-items: center;
  justify-content: center;
    }
  button { 
    width: 100px;
    height: 50px;
    background: white;
    border-radius: 20px;
    font-size: 12px;
  }
  #color,#area,#tadris{
    width: 40px;
    height: 40px;
    border: none;
    display: flex;
    place-content:center;
    place-items:center;
    background:rgba(255,255, 255, .5);
    border-radius: 20px;
    font-size: 20px;
  }
  #sec {
    display:flex;
    flex-flow:row;
    gap: 100px;
  }
  #settings {
    width: 160px;
    height: 50px;
    background: rgba(255, 255, 255, 0.5);
    display: flex;
    flex-flow: row;
    border-radius: 0 0 0 20px;
    align-items: center;
  justify-content: center;
    gap: 10px;
  }
  #sell {
    background:green;
    color: white;
    border-radius: 20px;
    position: fixed;
    bottom: 10px;
    left: 10px;
  }
  #dgsll {
    background: #4e4e4e;
    display: flex;
    place-content: center;
    place-items: center;
    font-size: 25px;
    color: white;
    width: 150px;
    height: 70px;
    margin: auto;
  }
  #house {
    background: grey;
    width: 60px;
    height: 60px;
    border: 2px ridge #000;
      place-content: center;
  text-align: center;
  font-size: 10px;
    touch-action: none;
  position: absolute;
    grid-template-columns: repeat(auto-fill, 60px);
  grid-template-rows: repeat(auto-fill, 60px);
  }
  #color1,#color2,#color3,#color4,#color5 {
    border: 1px #000 ridge;
    border-radius: 20px;
  }
  #color1 {
    background: yellow;
  }
  #color2 {
    background:pink;
  }  
  #color3 {
    background: red;
    color: white;
  } 
  #color4 {
    background: #42f12e;
  }  
  #color5 {
    background: purple;
    color: white;
  } 
  #vtr {
    display: flex;
    flex-flow: row;
    gap: 25px;
    align-items: center;
    justify-content: flex-start; 
}
 
  #hvr {
    display: flex;
    flex-flow: column;
    gap: 25px;
    width: 331px;
    height: 541px;
    justify-content: center;
    align-items: start;
  }
  .cntr,.cntr1 {
    width: 5px;
    height: 5px;
    font-size: 7px;
  }
  dialog {
    width: 90vw;
    height: 200px;
    border: none;
    margin: auto;
  }
  .hajr {
    background:#83661b;
    color:#fff;
    width: 25%;
    height: 25%;
    border-radius:50%;
    position: absolute;
  }
:nth-child(1 of .hajr){
    top: 20%;
    left: 10%;
  }
:nth-child(2 of .hajr){
    top: 40%;
    left: 10%;
}
:nth-child(3 of .hajr){
    top: 30%;
    left: 70%;
}
:nth-child(4 of .hajr){
    top: 80%;
    left: 20%;
}
:nth-child(5 of .hajr){
    top: 80%;
    left: 45%;
}
:nth-child(6 of .hajr){
    top: 10%;
    left: 10%;
  }
:nth-child(7 of .hajr){
    top: 0%;
    left: 30%;
}
  #pnt {
   width: 5px; 
  height: 5px;
    background: red;
    box-shadow: 1px 1px 1px 5px red;
    position: absolute;
    border-radius: 50px;
   animation: sal 2s infinite;
    display: none;
  }
@keyframes sal {
  50% {
    box-shadow: none;
  }
}
button[command=close] {
  width: 10px;
  height: 10px;
 position: absolute; 
 top: 5px;
  left: 5px;
}
#plus {
  position:fixed;
  top:40px;
  left: 30px;
  width: 50px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#winner {
  width: 160px;
  accent-color: gold;
}
#tagad {
  width:300px;
  position: fixed;
  top: 100px;
  left: 30px;
  display: flex;
  flex-flow: row-reverse;
  gap: 5px;
}
label {
  color:white;
}
#sell2,#sell3 {
 width: 80px;
height: 40px;
border-radius: 20px;
  background: green;
  color: white;
  position: relative;
}
#sell2 {
  background: red;
}
#allitemsell {
  width: 100%;
  height: 100%;
  background: blue;
  color: white;
  display:flex;
  flex-flow: column;
  gap: 5px;
  align-items: center;
  justify-content: center;
}
#sell1 {
 width: 95vw;
 height: 40vh; 
}
  </style>
</head>
<body>
<section id="sec">
  <header id="points">
    <span id="coin">🪙</span>
    <span id="number">1000</span>
  </header>
  <div id="plus"></div>
<header id="settings">
<button id="color" onclick="set1.showModal()">🎨</button>
<button id="area" onclick="set2.showModal()" >  <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
       stroke="black" stroke-width="2.5"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/>
</svg>
</button>
<button id="tadris" onclick="set3.showModal()">🏜</button>
</header> 
</section>
  
  <dialog id="set1">
  <header id="chosec">
    <button id="color1"><span>70🪙</span></button>
    <button id="color2"><span>100🪙</span></button>
    <button id="color3"><span>130🪙</span></button>
    <button id="color4"><span>250🪙</span></button>
    <button id="color5"><span>450🪙</span></button>
  </header>
  <button id="close" commandfor="set1" command="close">❌</button>  
  </dialog>
  <dialog id="set2">
  <header id="areas">
    <button id="area1">↕️<br><span>250🪙</span></button>
    <button id="area2">↔️<br><span>500🪙</span></button>
    <button id="area3">⬆️⬆️<br><span>550🪙</span></button>
    <button id="area4">↔️↔️<br><span>1200🪙</span></button>
  </header>
 <button id="close" commandfor="set2" command="close">❌</button>   
  </dialog>
  <dialog id="set3">
  <header id="etu">
    <button id="btn1">🏜<br><span id="c">1000</span>🪙</button>
    <button id="btn2">🏝<br><span id="dd">1700</span>🪙</button>
    <button id="btn3">🏞<br><span id="dc">3000</span>🪙</button>
  </header>
  <button id="cose" commandfor="set3" command="close">❌</button>  
  </dialog>
<dialog id="sell1">
<header id="allitemsell">
<div id="dgsll">
  <span id="digisell"></span><span>🪙</span>
</div> 
  <input type="range" value = "1" max="2" min="1" id="sellvalue" step="0.05">
<div id="sjh"></div>
<div id="sells">
  <button id="sell2" commandfor="sell1" command="close">قبول</button>
 <button id="sell3" command="close" commandfor="sell1">رفض</button>
</div> 
</header>

</dialog>
<div id="tagad">
  <label id="winM">1000/1M</label>
  <progress id="winner" value="1000" max="1000000"></progress>
</div>
<small style="color:#fff;width:330px;text-align:center;font-size:12px;font-weight: 800; position:fixed;top:150px;left:15px;" id="sur"><span style="zoom:1.2;">😉</span>هناك سر صغير في اللعبة لن يكشفه الا العبقري</small>
  <section id="all">
        <div id="hvr"></div>
     <div id="vtr"></div>
    <header id="house">
      <div id="ddd">4m<sup><small>2</small></sup></div>
    <div class="hajr"></div>
    <div class="hajr"></div>
  <div class="hajr"> </div>
  <div class="hajr"> </div>
  <div class="hajr"></div>
 <div class="hajr"></div>
<div class="hajr"></div>
    </header>
 <div id="pnt"></div>
</section>
<button id="sell">بيع</button>
<script> 
function varb(a) {
 plus.innerText = a 
if (plus.innerText[0] == "-") {
  plus.style.color = "red"
} else {
  plus.style.color = "lightgreen"
}
setTimeout(()=>{
  plus.innerText = ""
},1000)
}
function win(a) {
  winner.value = Number(winner.value)+a
  winM.innerText = `${Number(winner.value)}/1M`
if(Number(winner.value) >= 10**6){
winner.max = 10**7 
  winM.innerText = `${Number(winner.value)}/10M`
}else if(Number(winner.value) >= 10**7 && Number(winner.value) <= 10**8){
  winner.max = 10**8 
  winM.innerText = `${Number(winner.value)}/100M`
}else if(Number(winner.value) >= 10**8 && Number(winner.value) <= 10**9){
  winner.max = 10**9
  winM.innerText = `${Number(winner.value)}/1B`
}else if (Number(winner.value) >= 10**9) {
  tagad.style.display = "none"
}
}
for (let index = 1; index < 13; index++) {
  vtr.innerHTML +=`<span class="cntr">${index}</span>`
}
for (let index = -8; index < 9; index++) {
  hvr.innerHTML +=`<span class="cntr1">${index}</span>`
}
  let reward = Number(localStorage.getItem("reward")) || 0;
if (reward > 0) {
  number.innerText = Number(number.innerText) + reward*10;
  varb(`-${Number(number.innerText) + reward*10}`)
  localStorage.removeItem("reward");
}
p = 60
m = 60
let land = 20
function colorf(a,b,c) {
    if (Number(number.innerHTML) >= a) {
      number.innerHTML = Number(number.innerHTML)-a
      varb(`-${a}`)
      win(-a)
      house.style.background = b
      house.style.color = c
    }
}
  area1.addEventListener("click",()=>{
     if (Number(number.innerText) >= 250) {
       number.innerText = Number(number.innerText)-250
       varb("-250")
       win(-250)
       house.style.height=`${p+=15}px`
      ddd.innerHTML = `${((m/30)*(p/30)).toFixed(2)}m<sup><small>2</small></sup>`
     }
  })

  area2.addEventListener("click",()=>{
  if (Number(number.innerText) >= 500) {
    number.innerText = Number(number.innerText)-500
    varb("-500")
    win(-500)
    house.style.width=`${m+=30}px`
      ddd.innerHTML = `${((m/30)*(p/30)).toFixed(2)}m<sup><small>2</small></sup>`
  }
  })
  
  area3.addEventListener("click",()=>{
    if (Number(number.innerText) >= 550) {
       number.innerText = Number(number.innerText)-550
      varb("-550")
      win(-550)
       house.style.height=`${p+=30}px`
      ddd.innerHTML = `${((m/30)*(p/30)).toFixed(2)}m<sup><small>2</small></sup>`
     }
    
  })
  area4.addEventListener("click",()=>{
    if (Number(number.innerText) >= 1200) {
    number.innerText = Number(number.innerText)-1200
      varb("-1200")
      win(-1200)
    house.style.width=`${m+=60}px`
      ddd.innerHTML = `${((m/30)*(p/30)).toFixed(2)}m<sup><small>2</small></sup>`
    }    
  })

  d1 = 0
  color1.addEventListener("click",()=>{
    d1++
  if (d1 == 1) {
    colorf(70,"yellow","black")
  }
    
  })
  d2 = 0
  color2.addEventListener("click",()=>{
    d2++
  if (d2 == 1) {
    colorf(100,"pink","black")
  }
    
  })
    d3 = 0
  color3.addEventListener("click",()=>{
    d3++
  if (d3 == 1) {
    colorf(130,"red","white")
  }
   //   وردي 80،احمر 110،ابيض 170،بنفسجي 350  
  })
    d4 = 0
  color4.addEventListener("click",()=>{
    d4++
  if (d4 == 1) {
    colorf(250,"#42f12e","black")
  }
    
  })
    d5 = 0
  color5.addEventListener("click",()=>{
    d5++
  if (d5 == 1) {
    colorf(450,"purple","white")
  }
  })
btn1.addEventListener("click",()=>{
  if (Number(number.innerText) >= Number(c.innerText)) {

    number.innerText = Number(number.innerText)-Number(c.innerText)
    varb(`-${Number(c.innerText)}`)
    win(-Number(c.innerText))
  land = 40
   all.style.backgroundColor="#cab533" 
  } 
})
  btn2.addEventListener("click",()=>{
  if (Number(number.innerText) >= Number(dd.innerText)) {

    number.innerText = Number(number.innerText)-Number(dd.innerText)
    varb(`-${Number(dd.innerText)}`)
    win(-Number(dd.innerText))
 land = 60
   all.style.backgroundColor="#f8e571" 
  } 
})
btn3.addEventListener("click",()=>{
  if (Number(number.innerText) >= Number(dc.innerText)) {

    number.innerText = Number(number.innerText)-Number(dc.innerText)
    varb(`-${Number(dc.innerText)}`)
    win(-Number(dc.innerText))
  land = 100
   all.style.backgroundColor="#37b020" 
  } 
})
sell.addEventListener("click",()=>{
  sell1.showModal()
if(house.style.background == "yellow"){
  digisell.innerText =Math.round(m*p*0.3*1.1)
      digisell.innerText = Number(digisell.innerText)-document.querySelectorAll(".hajr").length*50
}
else if(house.style.background == "pink"){
  digisell.innerText =Math.round(m*p*0.3*1.3)
  digisell.innerText = Number(digisell.innerText)-document.querySelectorAll(".hajr").length*50
}
else if(house.style.background == "red") {
  digisell.innerText =Math.round(m*p*0.3*1.5)
      digisell.innerText = Number(digisell.innerText)-document.querySelectorAll(".hajr").length*50
}else if(house.style.background == "#42f12e"){
  digisell.innerText =Math.round(m*p*0.3*1.9)
      digisell.innerText = Number(digisell.innerText)-document.querySelectorAll(".hajr").length*50
}
else if (m == 60 && p == 60){
  digisell.innerText = 0
}
else if(house.style.background == "purple"){
  digisell.innerText = Math.round(m*p*0.3*2.5)
      digisell.innerText = Number(digisell.innerText)-document.querySelectorAll(".hajr").length*50
}else {
  digisell.innerText = Math.round(m*p*0.3)
      digisell.innerText = Number(digisell.innerText)-document.querySelectorAll(".hajr").length*50
}
let base = Number(digisell.innerText)
sellvalue.oninput=()=>{
  if (m == 60 && p == 60) {
    digisell.innerText= 0
  } else {
    digisell.innerText = Math.round(base*sellvalue.value)
  if (sellvalue.value >= 1.75) {
    digisell.style.color = "red"
    sellvalue.style.accentColor="red"
   sjh.innerHTML='<small>السعر غالي جدا اريد تفاوض معك</small>'
  let  setint=setInterval(()=>{
    Mathra = Math.random()*2
if(Mathra <= 1.75 && Mathra >= 1 ){
      sellvalue.value = Mathra.toFixed(2)
      digisell.innerText = Math.round(base*sellvalue.value)
      sellvalue.disabled = true
}
    sell2.style.pointerEvents = "none"
    },1000)
    setTimeout(()=>{
      clearInterval(setint)
    sjh.innerHTML="<small><span>☺️</span>هذا سعر مناسب لي هل تقبله</small>"
     sell2.style.pointerEvents = "auto" 
    },5000)
  }else {
    digisell.style.color="green"
    sellvalue.style.accentColor="green"
    sjh.innerHTML = ""
  }
  }
}
  
sell3.onclick = ()=>{
  sellvalue.disabled = false
  sellvalue.value = 1
  sjh.innerText = ""
}

sell2.onclick =()=>{
sellvalue.disabled = false
sellvalue.value = 1
sjh.innerText = ""
number.innerText = Number(number.innerText)+Number(digisell.innerText) 
varb(`+${Number(digisell.innerText)}`)
win(Number(digisell.innerText))
m = 60
p = 60
d1 = d2 = d3 = d4 = d5 = 0
house.style.width = "60px"
house.style.height = "60px"
house.style.background="grey"
ddd.innerHTML = "4m<sup><small>2</small></sup>"
digisell.style.color="green"
sellvalue.style.accentColor="green"
house.innerHTML+='<div class="hajr"></div><div class="hajr"></div><div class="hajr"></div><div class="hajr"> </div><div class="hajr"></div><div class="hajr"></div><div class="hajr"></div>'
hajr = document.querySelectorAll(".hajr")
hajr.forEach(hjr =>{
  hjr.onclick=()=>{
    if (Number(number.innerText) >= 10) {
      number.innerText = Number(number.innerText)-10
      varb("-10")
      win(-10)
      house.removeChild(hjr)

    }
  }
})
}
})

let dragging = false;
let dx = 0, dy = 0;

house.addEventListener("pointerdown", (e) => {
  dragging = true;
  dx = e.clientX - house.offsetLeft;  // المسافة من صباعك لركن الشكل
  dy = e.clientY - house.offsetTop;
  house.setPointerCapture(e.pointerId); // يفضل ماسك الشكل لو صباعك خرج منه
});

house.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  house.style.left = (e.clientX - dx) + "px";
  house.style.top  = (e.clientY - dy) + "px";
if(house.offsetLeft <= 0){
  all.style.borderLeftColor="red"
  all.style.borderLeftStyle="solid"
  all.style.borderLeftWidth = "2px"
}else {
  all.style.borderLeft = "none"
}
if(house.offsetLeft > 270){
  all.style.borderRightColor="red"
  all.style.borderRightStyle="solid"
  all.style.borderRightWidth = "2px"
}else {
  all.style.borderRight = "none"
  }
  if(house.offsetTop <= 0){
  all.style.borderTopColor="red"
  all.style.borderTopStyle="solid"
  all.style.borderTopWidth = "2px"
}else {
  all.style.borderTop = "none"
  }
  if(house.offsetTop >= 360){
  all.style.borderBottomColor="red"
  all.style.borderBottomStyle="solid"
  all.style.borderBottomWidth = "2px"
}else {
  all.style.borderBottom = "none"
  }
});

house.addEventListener("pointerup", () => {
  dragging = false;
});
hajr = document.querySelectorAll(".hajr")
hajr.forEach(hjr =>{
  hjr.onclick=()=>{
    if (Number(number.innerText) >= 10) {
      number.innerText = Number(number.innerText)-10
      varb("-10")
      win(-10)
      house.removeChild(hjr)

    }
  }
})

setInterval(()=>{
 rand = Math.random()
 pnt.style.display = "block" 
  pnt.style.top = `${Math.random()*400}px`
  pnt.style.left = `${Math.random()*350}px`
pnt.onclick = ()=>{
  sur.innerHTML = "لقد كشفته ايها العبقري لم اتوقع ذلك"
  number.innerText = Number(number.innerText)+Math.round(rand*land)
  varb(`+${Math.round(rand*land)}`)
  win(Math.round(rand*land))
}
},1000)

</script>
</body>
  </html>
